experiment:
  name: usa_baseline_cnn_lstm
  country: usa
  model: cnn_lstm  # or 'lstm'

model:
  n_features: 10
  cnn_channels: 64
  hidden_size: 128
  n_layers: 2
  dropout: 0.2

training:
  epochs: 100
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_scheduler: cosine   # cosine | step | none
  patience: 15           # early stopping patience (val loss)
  seed: 42

data:
  year_splits:
    train: [2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010,
            2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
    val:   [2021, 2022]
    test:  [2023]

output:
  checkpoint_dir: experiments/checkpoints/usa_baseline
  log_dir: experiments/logs
